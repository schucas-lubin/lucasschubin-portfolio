<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Sprint | Lucas Schubin</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="geographyGame.css">
</head>
<body>
    <header class="nav-container">
        <nav class="main-nav">
            <div class="logo">
                <a href="../../index.html">Lucas Schubin</a>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../index.html" class="active">Games</a></li>
                <li><a href="../../projects/index.html">Projects</a></li>
            </ul>
        </nav>
    </header>

    <main class="game-container">
        <div class="game-header reveal-element">
            <h1>Geography Sprint</h1>
            <p>A country-naming challenge against the clock</p>
        </div>
        
        <div class="geo-game-container reveal-element">
            <div class="geo-game-header">
                <div class="game-title">Geography Sprint</div>
                <div class="timer-settings">
                    <button class="timer-button decrease-time">↑</button>
                    <div class="timer-display">
                        <span id="timer-value">60</span>s
                    </div>
                    <button class="timer-button increase-time">↓</button>
                </div>
                <div id="timer-progress" class="timer-progress">
                    <div class="timer-progress-bar"></div>
                </div>
            </div>
            
            <div class="geo-game-content">
                <div class="earth-container">
                    <div class="earth-graphic">
                        <!-- Pixel-style Earth graphic -->
                        <div class="earth-pixel"></div>
                    </div>
                    <div class="current-letter-display">
                        <span id="current-letter">A</span>
                    </div>
                </div>
                
                <div class="countries-list">
                    <h3>Countries Named <span id="countries-counter">0/0</span></h3>
                    <ul id="named-countries"></ul>
                </div>
            </div>
            
            <div class="geo-game-input">
                <form id="country-form">
                    <input type="text" id="country-input" placeholder="Type a country name...">
                    <button type="submit" id="submit-button">Enter</button>
                </form>
            </div>
            
            <div id="game-results" class="game-results">
                <h2>Game Over!</h2>
                <p id="results-message"></p>
                <div id="missed-countries"></div>
                <button id="play-again-button">Play Again</button>
            </div>
        </div>
        
        <div id="country-hints" class="country-hints"></div>
    </main>

    <footer class="reveal-element">
        <p>&copy; 2024 Lucas Schubin. All rights reserved.</p>
    </footer>
    
    <script src="../../scripts.js"></script>
    <script type="module" src="geographyGame.js"></script>
</body>
</html>
